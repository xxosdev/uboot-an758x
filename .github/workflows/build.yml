name: Build AN758x U-Boot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - hg5382a
          - hg5585f-ct
          - hg5585f-cu
          - xg2010g
          - xr1710g
          - zn504xg-d
          - zn515xg-d
          - ung00a
          - xg-040g-md
          - xg-040g-tf
          - xg-040g-mf
          - hm2004-du
          # EN7523 (EN7529CT). 32-bit U-Boot; no preloader/FIP yet, see
          # scripts/build-an758x.sh.
          - hl202-du

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          # libgnutls28-dev is needed by the mkeficapsule host tool. No board
          # in the matrix builds it today, but it is only one apt package and
          # the failure it causes is a confusing one (host tool compile error
          # in the middle of a cross build).
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison ca-certificates curl device-tree-compiler flex \
            gcc-aarch64-linux-gnu gcc-arm-none-eabi libgnutls28-dev libssl-dev \
            python3 python3-pyelftools swig

      - name: Download Mbed TLS
        run: |
          curl -L https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/v3.4.1.tar.gz |
            tar -xz
          echo "MBEDTLS_DIR=$PWD/mbedtls-3.4.1" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.target }}
        env:
          CROSS_COMPILE: aarch64-linux-gnu-
          ARM32_CROSS_COMPILE: arm-none-eabi-
          BUILD_JOBS: 4
          AIROHA_SIGN_KEY: ${{ secrets.AIROHA_SIGN_KEY }}
        run: ./scripts/build-an758x.sh "${{ matrix.target }}"

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: uboot-${{ matrix.target }}
          # An758x boards produce the an7581-/an7583- preloader and FIP; the
          # EN7523 board only has u-boot.bin/u-boot.lzma/u-boot.dtb so far.
          path: |
            output/${{ matrix.target }}/an75*
            output/${{ matrix.target }}/en75*
            output/${{ matrix.target }}/u-boot*
            output/${{ matrix.target }}/README-*.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: uboot-*
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/* --generate-notes
          --repo "$GITHUB_REPOSITORY"
